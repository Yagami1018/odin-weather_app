<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>

<body>
    <header>
        <h1 class="Title">My Weather App</h1>
    </header>
    <main>
        <form action="" novalidate method="get">
            <p>
                <label for="search">Enter a city:*</label>
                <input id="search" type="search" autofocus required autocomplete="off" minlength="4">
                <span class="error"></span>
            </p>
            <button class="submit-btn">Search</button>
        </form>
    </main>
    <footer><a href="https://github.com/Yagami1018">&copy; Yagami1018</a></footer>
</body>

</html>
