<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
<script defer src="main.js"></script></head>

<body>
    <header>
        <h1 class="Title">My Weather App</h1>
    </header>
    <main>
        <form novalidate method="get">
            <p>
                <label for="search">Enter a city:*</label>
                <input id="search" name="city" type="search" autofocus required autocomplete="off">
                <span class="error"></span>
            </p>
            <div class="rad-btns">
                <label for="celcius-rad-btn">
                    <input type="radio" name="temp" checked id="celcius-rad-btn" value="C">
                    Celcius
                </label>
                <label for="fahrenheit-rad-btn">
                    <input type="radio" name="temp" id="fahrenheit-rad-btn" value="F">
                    Fahrenheit
                </label>
            </div>
            <button class="submit-btn">Search</button>
        </form>
    </main>
    <div class="weather-card">

    </div>
    <footer><a href="https://github.com/Yagami1018">&copy; Yagami1018</a></footer>
</body>

</html>
